name: Release Artifact

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  integration-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7

      - name: Detect bridge token
        id: token
        shell: pwsh
        env:
          BRIDGE_REPO_TOKEN: ${{ secrets.BRIDGE_REPO_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BRIDGE_REPO_TOKEN)) {
            "has_token=false" >> $env:GITHUB_OUTPUT
            Write-Host "BRIDGE_REPO_TOKEN is not set. Integration smoke will be skipped."
          } else {
            "has_token=true" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout bridge repository
        if: steps.token.outputs.has_token == 'true'
        uses: actions/checkout@v7
        with:
          repository: mergi72/dms-provider-bridge
          ref: main
          path: dms-provider-bridge
          token: ${{ secrets.BRIDGE_REPO_TOKEN }}

      - name: Setup Python 3.12
        if: steps.token.outputs.has_token == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install bridge dependencies
        if: steps.token.outputs.has_token == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./dms-provider-bridge

      - name: Run bridge integration smoke
        if: steps.token.outputs.has_token == 'true'
        shell: pwsh
        run: ./scripts/run-bridge-smoke.ps1 -BridgeRepoPath ./dms-provider-bridge

  build-artifact:
    needs: integration-smoke
    if: always() && (needs.integration-smoke.result == 'success' || needs.integration-smoke.result == 'skipped')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish plugin
        run: dotnet publish src/TcWfxPlugin/TcWfxPlugin.csproj --configuration Release -r win-x64 /p:PublishAot=true /p:NativeLib=Shared --output artifacts/TcWfxPlugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc-wfx-plugin-release
          path: artifacts/TcWfxPlugin
