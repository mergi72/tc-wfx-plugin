name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  integration-smoke:
    if: ${{ secrets.BRIDGE_REPO_TOKEN != '' }}
    runs-on: windows-latest

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4

      - name: Checkout bridge repository
        uses: actions/checkout@v4
        with:
          repository: mergi72/edocat-bridge
          ref: main
          path: edocat-bridge
          token: ${{ secrets.BRIDGE_REPO_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bridge dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./edocat-bridge

      - name: Run bridge integration smoke
        shell: pwsh
        run: ./scripts/run-bridge-smoke.ps1 -BridgeRepoPath ./edocat-bridge
